<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTU Result Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1>🎓 KTU Result Analyzer</h1>
            <p>Automated SGPA Calculator & Analytics Engine</p>
        </header>

        <div class="upload-area" id="drop-zone">
            <input type="file" id="file-input" accept=".pdf" hidden>
            <div class="icon">📂</div>
            <h3>Drag & Drop Result PDF Here</h3>
            <p>or <span class="browse-btn" onclick="document.getElementById('file-input').click()">Browse Files</span></p>
            <p class="file-name" id="file-name"></p>
        </div>

        <button id="analyze-btn" class="btn-primary" disabled>🚀 Analyze Results</button>

        <div class="status-box" id="status-box" style="display: none;">
            <div class="loader"></div>
            <p id="status-text">Processing your data...</p>
        </div>

        <div id="download-section" style="display: none;">
            <a href="/download" class="btn-success">📥 Download Excel Master Sheet</a>
            <p class="success-msg">✅ Analysis Complete!</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
